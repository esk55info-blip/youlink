name: WhatsApp Media Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yt-dlp and dependencies
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          npm install

      - name: Restore encrypted WhatsApp session
        env:
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: |
          sudo mkdir -p /app/auth
          sudo chown -R $USER:$USER /app
          if [ -f auth.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in auth.enc -out auth.tar.gz -pass env:SESSION_KEY
            tar -xzf auth.tar.gz -C /
            sudo chown -R $USER:$USER /app
            rm -f auth.tar.gz
            echo "Session restored successfully."
          fi

      - name: Run WhatsApp Bot (24/7 Auto-Renew)
        env:
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf "%s\n" "$YT_COOKIES" > /tmp/cookies.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          (
            while true; do
              sleep 25
              if [ -f /app/auth/creds.json ] && grep -q '"registered":true' /app/auth/creds.json && [ ! -f /tmp/initial_saved ]; then
                tar -czf auth.tar.gz /app/auth
                openssl enc -aes-256-cbc -salt -pbkdf2 -in auth.tar.gz -out auth.enc -pass env:SESSION_KEY
                rm -f auth.tar.gz
                git checkout -- package.json package-lock.json 2>/dev/null || true
                git add auth.enc
                git diff --cached --quiet || git commit -m "Save initial WhatsApp session"
                git pull --rebase || true
                git push || true
                touch /tmp/initial_saved
              fi
            done
          ) &
          WATCHER_PID=$!

          timeout 19200 node index.js || true
          kill $WATCHER_PID 2>/dev/null || true

          if [ -f /app/auth/creds.json ]; then
            tar -czf auth.tar.gz /app/auth
            openssl enc -aes-256-cbc -salt -pbkdf2 -in auth.tar.gz -out auth.enc -pass env:SESSION_KEY
            rm -f auth.tar.gz
            git checkout -- package.json package-lock.json 2>/dev/null || true
            git add auth.enc
            git diff --cached --quiet || git commit -m "Update WhatsApp session"
            git pull --rebase || true
            git push || true
          fi

          gh workflow run bot.yml --repo ${{ github.repository }} || true
